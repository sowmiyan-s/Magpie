<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magpie — AI Web Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --border-hover: #CBD5E1;
      --border-focus: #0F172A;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-subtle: #94A3B8;
      
      --accent: #0F172A;
      --accent-hover: #1E293B;
      --primary-yellow: #FFE600;
      --primary-glow: rgba(255, 230, 0, 0.4);
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-purple: #8B5CF6;
      --accent-red: #EF4444;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;

      --shadow-subtle: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --neo-shadow: 2.5px 2.5px 0px #0F172A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 440px;
      min-height: auto;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 16px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* Tab mode responsiveness */
    body.tab-mode {
      width: 100%;
      max-width: 720px;
      padding: 36px 20px;
      min-height: 100vh;
      background: #F1F5F9;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--border-focus);
      border-radius: var(--radius-md);
      box-shadow: var(--neo-shadow);
      background: var(--primary-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: var(--primary-yellow);
      color: #000;
      border: 1px solid var(--text-main);
      border-radius: var(--radius-sm);
      padding: 1px 5px;
      letter-spacing: 0.02em;
    }

    /* Header Nav Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 4px 10px;
      cursor: pointer;
      max-width: 140px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-subtle);
    }
    .model-chip:hover {
      border-color: var(--text-main);
      transform: translateY(-1px);
    }
    .model-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      flex-shrink: 0;
    }
    .status-dot.offline {
      background: var(--accent-red);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-subtle);
      transition: all 0.15s ease;
    }
    .btn-icon:hover {
      border-color: var(--text-main);
      background: #F8FAFC;
      transform: translateY(-1px);
    }
    .btn-icon.active {
      background: var(--primary-yellow);
      border-color: var(--text-main);
      box-shadow: 1.5px 1.5px 0px #0F172A;
    }

    /* ── Views ── */
    .view-container {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .view-container.active {
      display: flex;
    }

    /* ── Integrated Search Box ── */
    .search-card {
      background: #FFFFFF;
      border: 1.5px solid var(--text-main);
      border-radius: var(--radius-lg);
      box-shadow: var(--neo-shadow);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.2s;
    }
    .search-card:focus-within {
      box-shadow: 3.5px 3.5px 0px #0F172A;
    }
    .search-textarea {
      width: 100%;
      min-height: 68px;
      max-height: 180px;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-main);
      background: transparent;
      resize: vertical;
    }
    .search-textarea::placeholder {
      color: var(--text-subtle);
      font-size: 13px;
    }

    /* Search Bottom Bar */
    .search-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border-color);
    }
    .toggles-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: #F1F5F9;
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      padding: 4px 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .toggle-chip input { display: none; }
    .toggle-chip:hover {
      color: var(--text-main);
      background: #E2E8F0;
    }
    .toggle-chip.active {
      color: #000;
      background: var(--primary-yellow);
      border-color: var(--text-main);
      font-weight: 700;
    }
    
    .mode-select {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      background: #F1F5F9;
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      padding: 4px 20px 4px 8px;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      transition: all 0.15s ease;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 12px;
    }
    .mode-select:hover, .mode-select:focus {
      color: var(--text-main);
      background-color: #E2E8F0;
    }

    /* Search Submit Button */
    .btn-submit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #FFFFFF;
      border: 1.5px solid var(--text-main);
      border-radius: var(--radius-md);
      padding: 7px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 1.5px 1.5px 0px rgba(0,0,0,0.15);
      transition: all 0.15s ease;
    }
    .btn-submit:hover {
      background: #1E293B;
      transform: translateY(-1px);
      box-shadow: 2.5px 2.5px 0px #000;
    }
    .btn-submit:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .btn-submit .kbd-hint {
      font-size: 9.5px;
      opacity: 0.7;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Quick Starter Suggestions ── */
    .quick-starters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .starter-btn {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .starter-btn:hover {
      border-color: var(--text-main);
      color: var(--text-main);
      background: #FFFDF0;
      transform: translateY(-1px);
    }

    /* ── Result Card ── */
    .result-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .result-card.has-content {
      border-color: var(--text-main);
      box-shadow: var(--neo-shadow);
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .result-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .result-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-action-mini {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s;
    }
    .btn-action-mini:hover {
      background: var(--primary-yellow);
      border-color: var(--text-main);
    }

    /* Result Content Typography */
    .result-body {
      font-size: 13px;
      line-height: 1.6;
      color: #1E293B;
      overflow-wrap: break-word;
    }
    .result-body p { margin-bottom: 8px; }
    .result-body p:last-child { margin-bottom: 0; }
    .result-body ul, .result-body ol {
      margin: 6px 0 8px 18px;
    }
    .result-body li { margin-bottom: 3px; }
    .result-body h1, .result-body h2, .result-body h3 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      margin: 12px 0 6px 0;
      line-height: 1.3;
    }
    .result-body h1 { font-size: 15px; border-bottom: 1.5px solid var(--border-color); padding-bottom: 3px; }
    .result-body h2 { font-size: 14px; }
    .result-body h3 { font-size: 13px; font-weight: 700; }
    .result-body code {
      background: #F1F5F9;
      color: #D946EF;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      border: 1px solid #E2E8F0;
    }
    .result-body pre {
      background: #0F172A;
      color: #F8FAFC;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin: 8px 0;
    }
    .result-body pre code {
      background: transparent;
      color: inherit;
      border: none;
      padding: 0;
    }
    .result-body a {
      color: #2563EB;
      text-decoration: underline;
      font-weight: 600;
    }
    .result-body blockquote {
      border-left: 3px solid var(--primary-yellow);
      background: #FFFDF0;
      padding: 6px 10px;
      border-radius: 0 4px 4px 0;
      margin: 6px 0;
    }

    /* Loading Pulse */
    .loading-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #FFFDF0;
      border: 1px dashed var(--text-main);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
    }
    .spinner-dot {
      width: 14px;
      height: 14px;
      border: 2px solid #CBD5E1;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Sources List Pills */
    .sources-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }
    .source-pill {
      font-size: 10.5px;
      background: #F1F5F9;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 2px 8px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .source-pill:hover {
      background: #E2E8F0;
      color: var(--text-main);
    }

    /* ── Settings View ── */
    .settings-card {
      background: #FFFFFF;
      border: 1.5px solid var(--text-main);
      border-radius: var(--radius-lg);
      box-shadow: var(--neo-shadow);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .settings-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border-color);
    }
    .settings-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .server-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: #F1F5F9;
      border: 1px solid var(--border-color);
    }
    .server-status.online { background: #ECFDF5; color: #065F46; border-color: #A7F3D0; }
    .server-status.offline { background: #FEF2F2; color: #991B1B; border-color: #FECACA; }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-input-field {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 12.5px;
      background: #FFFFFF;
      outline: none;
      transition: all 0.15s ease;
    }
    .form-input-field:focus {
      border-color: var(--text-main);
      box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.08);
    }
    .form-help {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    /* Model Chips in Settings */
    .model-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }
    .model-chip-select {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      background: #F8FAFC;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.12s;
    }
    .model-chip-select:hover {
      border-color: var(--text-main);
      background: #FFFFFF;
    }
    .model-chip-select.active {
      background: var(--primary-yellow);
      border-color: var(--text-main);
      font-weight: 700;
      box-shadow: 1px 1px 0px #0F172A;
    }

    .settings-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }
    .btn-save {
      background: var(--primary-yellow);
      color: #000;
      border: 1.5px solid var(--text-main);
      border-radius: var(--radius-md);
      padding: 8px 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0px #0F172A;
      transition: all 0.15s ease;
    }
    .btn-save:hover {
      background: #FFED4A;
      transform: translateY(-1px);
      box-shadow: 2.5px 2.5px 0px #0F172A;
    }
    .btn-done {
      background: #FFFFFF;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      transition: all 0.15s;
    }
    .btn-done:hover {
      border-color: var(--text-main);
      background: #F8FAFC;
    }
    .save-alert {
      font-size: 11px;
      font-weight: 700;
      color: #065F46;
      background: #D1FAE5;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      display: none;
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header class="header">
    <div class="brand" id="brand-link" title="Magpie AI Agent">
      <div class="logo-badge">
        <img src="icons/icon48.png" alt="Magpie Logo">
      </div>
      <div class="brand-text">
        <div class="brand-name">
          Magpie
          <span class="brand-badge">AI</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <!-- Active Model Chip (Click opens settings) -->
      <div class="model-chip" id="header-model-chip" title="Settings — Click to configure">
        <span class="status-dot" id="header-status-dot"></span>
        <span class="model-chip-name" id="header-model-name">Agent Online</span>
      </div>

      <!-- Settings Icon Button -->
      <button class="btn-icon" id="btn-toggle-settings" title="Open Settings & Model Picker">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>

      <!-- Expand to Tab Button -->
      <button class="btn-icon" id="btn-open-tab" title="Open in dedicated tab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- ─── MAIN VIEW ─── -->
  <main class="view-container active" id="view-main">

    <!-- Integrated Search Card -->
    <div class="search-card">
      <textarea id="query" class="search-textarea" rows="3" placeholder="Ask anything, research a topic, or summarize this page..."></textarea>
      
      <div class="search-footer">
        <div class="toggles-group">
          <label class="toggle-chip active" id="chip-search" title="Search web via DuckDuckGo & Bing">
            <input type="checkbox" id="search-enabled-toggle" checked>
            <span>🌐 Web</span>
          </label>
          <label class="toggle-chip" id="chip-tab" title="Include text from currently open tab">
            <input type="checkbox" id="tab-context-toggle">
            <span>📄 This Tab</span>
          </label>
          <select id="mode-select" class="mode-select" title="Response Mode">
            <option value="default">Default Mode</option>
            <option value="summarize">Summarize</option>
            <option value="mcq">MCQ Mode</option>
            <option value="oneword">One Word</option>
          </select>
        </div>

        <button id="ask-btn" class="btn-submit">
          <span>Search</span>
          <span class="kbd-hint">↵</span>
        </button>
      </div>
    </div>

    <!-- Quick Starter Suggestions (shown when no result yet) -->
    <div class="quick-starters" id="quick-starters">
      <button class="starter-btn" data-query="Summarize the key points of this page in bullet points" data-tab="true">
        📄 Summarize page
      </button>
      <button class="starter-btn" data-query="What are the latest AI news and breakthroughs this week?" data-search="true">
        ⚡ Latest AI news
      </button>
      <button class="starter-btn" data-query="Explain quantum computing in simple terms" data-search="true">
        🔍 Quantum computing
      </button>
    </div>

    <!-- Result Card -->
    <section class="result-card" id="result-card">
      <div class="result-header">
        <span class="result-title" id="result-title">
          <span>Result</span>
        </span>
        <div class="result-actions">
          <button id="copy-btn" class="btn-action-mini" title="Copy response">Copy</button>
          <button id="clear-btn" class="btn-action-mini" title="Clear result">Clear</button>
        </div>
      </div>

      <div class="result-body" id="result">
        <span style="color:#94A3B8; font-size:12.5px;">Results will appear here. Enter your query above.</span>
      </div>

      <div class="sources-list" id="sources-list" style="display:none;"></div>
    </section>

  </main>

  <!-- ─── SETTINGS VIEW ─── -->
  <section class="view-container" id="view-settings">
    <div class="settings-card">
      <div class="settings-title-row">
        <span class="settings-title">⚙️ LLM Configuration</span>
        <span class="server-status" id="server-status-pill">
          <span class="status-dot" id="server-status-dot"></span>
          <span id="server-status-text">Checking server...</span>
        </span>
      </div>

      <!-- Provider Dropdown -->
      <div class="form-item">
        <label class="form-label" for="llm-provider">Provider</label>
        <select id="llm-provider" class="form-input-field">
          <option value="mistral">🔷 Mistral AI</option>
          <option value="ollama">🦙 Local Ollama</option>
          <option value="openai">🟢 OpenAI</option>
          <option value="groq">⚡ Groq (Fast)</option>
          <option value="nvidia">🟩 NVIDIA NIM</option>
          <option value="openrouter">🌐 OpenRouter</option>
          <option value="together">🤝 Together AI</option>
          <option value="custom">🔧 Custom Endpoint</option>
        </select>
      </div>

      <!-- Model Chips -->
      <div class="form-item">
        <label class="form-label">Available Models</label>
        <div class="model-chips-container" id="provider-models"></div>
      </div>

      <!-- Model Input -->
      <div class="form-item">
        <label class="form-label" for="model-name">Model Identifier</label>
        <input type="text" id="model-name" class="form-input-field" placeholder="e.g. open-mistral-nemo">
      </div>

      <!-- API Key -->
      <div class="form-item">
        <label class="form-label" for="api-key">API Key</label>
        <input type="password" id="api-key" class="form-input-field" placeholder="Enter provider API key">
        <span class="form-help" id="api-key-hint">Saved locally in Chrome extension storage.</span>
      </div>

      <!-- Base URL -->
      <div class="form-item">
        <label class="form-label" for="base-url">API Base URL</label>
        <input type="text" id="base-url" class="form-input-field" placeholder="https://api.mistral.ai/v1">
        <span class="form-help" id="base-url-hint">OpenAI-compatible endpoint.</span>
      </div>

      <!-- Backend URL -->
      <div class="form-item">
        <label class="form-label" for="backend-url">Python Backend URL</label>
        <input type="text" id="backend-url" class="form-input-field" placeholder="http://localhost:8000">
      </div>

      <!-- Footer Actions -->
      <div class="settings-footer">
        <button id="save-settings-btn" class="btn-save">Save Config</button>
        <span id="save-status" class="save-alert">Saved! ✔</span>
        <button id="btn-settings-done" class="btn-done">Done ✔</button>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
